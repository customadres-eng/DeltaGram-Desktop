name: DeltaGram Windows

# Builds DeltaGram.exe (x64, Qt 6, Release) and uploads it as a workflow
# artifact. Trigger it manually from the Actions tab or on every push to the
# default branch.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'

jobs:
  windows:
    name: Windows x64 Qt6
    runs-on: windows-latest

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      ARTIFACT_NAME: "DeltaGram Windows x64 qt6"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %GITHUB_WORKSPACE%\TBuild\Libraries
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          # The source archive shipped to the user has no submodules; CI pulls
          # them recursively here.
          submodules: recursive
          persist-credentials: true
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: 14.44

      - name: Add the ATL headers the pinned toolset is missing.
        shell: powershell
        run: |
          $root = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $path = & "$root\vswhere.exe" -latest -products * -property installationPath
          if (-not $path) { throw "Visual Studio installation not found" }
          $toolset = $env:VCToolsVersion.Trim()
          if (-not $toolset -and $env:VCToolsInstallDir) {
            $toolset = Split-Path $env:VCToolsInstallDir -Leaf
          }
          if (-not $toolset) { throw "Cannot detect the MSVC toolset version" }
          Write-Output "toolset: $toolset"
          $destination = "$path\VC\Tools\MSVC\$toolset\atlmfc"
          if (Test-Path "$destination\include\atlbase.h") {
            Write-Output "ATL already present for this toolset"
            exit 0
          }
          $source = Get-ChildItem "$path\VC\Tools\MSVC" -Directory |
            Where-Object { Test-Path "$($_.FullName)\atlmfc\include\atlbase.h" } |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $source) {
            Write-Output "Installing ATL into $path"
            $process = Start-Process -FilePath "$root\vs_installer.exe" -ArgumentList @(
              "modify", "--installPath", "`"$path`"",
              "--add", "Microsoft.VisualStudio.Component.VC.ATL",
              "--quiet", "--norestart", "--wait"
            ) -Wait -PassThru
            Write-Output "installer exit code: $($process.ExitCode)"
            $source = Get-ChildItem "$path\VC\Tools\MSVC" -Directory |
              Where-Object { Test-Path "$($_.FullName)\atlmfc\include\atlbase.h" } |
              Sort-Object Name -Descending |
              Select-Object -First 1
          }
          if (-not $source) { throw "ATL headers are missing everywhere" }
          Write-Output "copying ATL from $($source.Name) to $toolset"
          New-Item -ItemType Directory -Force "$destination\include" | Out-Null
          Copy-Item "$($source.FullName)\atlmfc\include\*" "$destination\include" -Recurse -Force
          if (Test-Path "$($source.FullName)\atlmfc\lib") {
            New-Item -ItemType Directory -Force "$destination\lib" | Out-Null
            Copy-Item "$($source.FullName)\atlmfc\lib\*" "$destination\lib" -Recurse -Force
          }
          if (-not (Test-Path "$destination\include\atlbase.h")) { throw "ATL copy failed" }
          Write-Output "ATL ready: $destination"

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        uses: actions/cache@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: thirdparty-v1-stable
          restore-keys: |
            thirdparty-v3-
            ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: libs-v2-stable
          restore-keys: |
            libs-v5-
            libs-v3-
            ${{ runner.OS }}-${{ runner.arch }}-libs-v2-

      - name: Qt cache.
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: qt6-stable
          restore-keys: |
            qt6-v5-
            qt6-v3-
            ${{ runner.OS }}-${{ runner.arch }}-qt6-

      - name: Inspect restored libraries.
        run: |
          echo === pkgconfig ===
          if exist "%LibrariesPath%\local\lib\pkgconfig" dir /B "%LibrariesPath%\local\lib\pkgconfig"
          echo === local\lib ===
          if exist "%LibrariesPath%\local\lib" dir /B "%LibrariesPath%\local\lib"
          echo === cache_keys ===
          if exist "%LibrariesPath%\cache_keys" dir /B "%LibrariesPath%\cache_keys"
          echo === top ===
          dir /B "%LibrariesPath%"

      - name: Drop libraries built with the GCC toolchain.
        run: |
          if not exist "%LibrariesPath%\mozjpeg\Debug\jpeg-static.lib" if exist "%LibrariesPath%\mozjpeg" rmdir /S /Q "%LibrariesPath%\mozjpeg"
          if not exist "%LibrariesPath%\mozjpeg\Release\jpeg-static.lib" if exist "%LibrariesPath%\mozjpeg" rmdir /S /Q "%LibrariesPath%\mozjpeg"
          if not exist "%LibrariesPath%\libavif\Debug\avif.lib" if exist "%LibrariesPath%\libavif" rmdir /S /Q "%LibrariesPath%\libavif"
          if not exist "%LibrariesPath%\libavif\Release\avif.lib" if exist "%LibrariesPath%\libavif" rmdir /S /Q "%LibrariesPath%\libavif"
          if not exist "%LibrariesPath%\rnnoise\out\Debug\rnnoise.lib" if exist "%LibrariesPath%\rnnoise" rmdir /S /Q "%LibrariesPath%\rnnoise"
          if not exist "%LibrariesPath%\rnnoise\out\Release\rnnoise.lib" if exist "%LibrariesPath%\rnnoise" rmdir /S /Q "%LibrariesPath%\rnnoise"
          if not exist "%LibrariesPath%\openh264\builddir-debug\libopenh264.a" if exist "%LibrariesPath%\openh264" rmdir /S /Q "%LibrariesPath%\openh264"
          if not exist "%LibrariesPath%\openh264\builddir-release\libopenh264.a" if exist "%LibrariesPath%\openh264" rmdir /S /Q "%LibrariesPath%\openh264"
          if not exist "%LibrariesPath%\dav1d\builddir-debug\src\libdav1d.a" if exist "%LibrariesPath%\dav1d" rmdir /S /Q "%LibrariesPath%\dav1d"
          if not exist "%LibrariesPath%\dav1d\builddir-release\src\libdav1d.a" if exist "%LibrariesPath%\dav1d" rmdir /S /Q "%LibrariesPath%\dav1d"
          if not exist "%LibrariesPath%\zlib\Debug\libzsd.lib" if exist "%LibrariesPath%\zlib" rmdir /S /Q "%LibrariesPath%\zlib"
          if not exist "%LibrariesPath%\zlib\Release\libzs.lib" if exist "%LibrariesPath%\zlib" rmdir /S /Q "%LibrariesPath%\zlib"
          if not exist "%LibrariesPath%\liblcms2\out\Debug\src\liblcms2.a" if exist "%LibrariesPath%\liblcms2" rmdir /S /Q "%LibrariesPath%\liblcms2"
          if not exist "%LibrariesPath%\liblcms2\out\Release\src\liblcms2.a" if exist "%LibrariesPath%\liblcms2" rmdir /S /Q "%LibrariesPath%\liblcms2"
          if not exist "%LibrariesPath%\libwebp\out\debug-static" if exist "%LibrariesPath%\libwebp" rmdir /S /Q "%LibrariesPath%\libwebp"
          if not exist "%LibrariesPath%\libwebp\out\release-static" if exist "%LibrariesPath%\libwebp" rmdir /S /Q "%LibrariesPath%\libwebp"
          if not exist "%LibrariesPath%\openssl3\out.dbg\libssl.lib" if exist "%LibrariesPath%\openssl3" rmdir /S /Q "%LibrariesPath%\openssl3"
          if not exist "%LibrariesPath%\openssl3\out\libssl.lib" if exist "%LibrariesPath%\openssl3" rmdir /S /Q "%LibrariesPath%\openssl3"
          if not exist "%LibrariesPath%\tg_angle\out\Debug\tg_angle.lib" if exist "%LibrariesPath%\tg_angle" rmdir /S /Q "%LibrariesPath%\tg_angle"
          if not exist "%LibrariesPath%\tg_angle\out\Release\tg_angle.lib" if exist "%LibrariesPath%\tg_angle" rmdir /S /Q "%LibrariesPath%\tg_angle"
          if not exist "%LibrariesPath%\ada\out\src\Debug\ada.lib" if exist "%LibrariesPath%\ada" rmdir /S /Q "%LibrariesPath%\ada"
          if not exist "%LibrariesPath%\ada\out\src\Release\ada.lib" if exist "%LibrariesPath%\ada" rmdir /S /Q "%LibrariesPath%\ada"
          if not exist "%LibrariesPath%\tg_owt\out\Debug" if exist "%LibrariesPath%\tg_owt" rmdir /S /Q "%LibrariesPath%\tg_owt"
          if not exist "%LibrariesPath%\tg_owt\out\Release" if exist "%LibrariesPath%\tg_owt" rmdir /S /Q "%LibrariesPath%\tg_owt"
          if not exist "%LibrariesPath%\local\lib\libheif.a" exit /b 0
          del /Q "%LibrariesPath%\local\lib\libheif.a" 2>NUL
          del /Q "%LibrariesPath%\local\lib\pkgconfig\libheif.pc" 2>NUL
          if exist "%LibrariesPath%\local\lib\cmake\libheif" rmdir /S /Q "%LibrariesPath%\local\lib\cmake\libheif"
          if exist "%LibrariesPath%\local\include\libheif" rmdir /S /Q "%LibrariesPath%\local\include\libheif"
          if exist "%LibrariesPath%\libheif" rmdir /S /Q "%LibrariesPath%\libheif"
          if exist "%LibrariesPath%\openal-soft" rmdir /S /Q "%LibrariesPath%\openal-soft"
          if exist "%LibrariesPath%\breakpad" rmdir /S /Q "%LibrariesPath%\breakpad"

      - name: Rebuild opus for the MSVC toolchain.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent opus <NUL 2>&1

      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent qt6 <NUL 2>&1

      - name: Free up some disk space.
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' -o -path '*/tdesktop_rust/*' ')' -type f ')' -o -empty ')' -delete

      - name: Configure.
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          x64 ^
          qt6 ^
          -D TDESKTOP_API_ID=34122536 ^
          -D TDESKTOP_API_HASH=8353c14fb75e19919d62f8e74432c51e ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D CMAKE_EXE_LINKER_FLAGS=dnsapi.lib ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      - name: Build DeltaGram.
        run: |
          set CL=/Zm1500
          cmake --build %TBUILD%\%REPO_NAME%\out --config Release --parallel 3

      - name: Collect artifact.
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\Release
          mkdir artifact
          copy %OUT%\DeltaGram.exe artifact\
          if exist %OUT%\Updater.exe copy %OUT%\Updater.exe artifact\

      - name: Deploy Qt runtime.
        continue-on-error: true
        run: |
          for /d %%D in ("%LibrariesPath%\qt6_*") do set QTBIN=%%D\bin
          if defined QTBIN "%QTBIN%\windeployqt.exe" --release --no-translations --no-opengl-sw --compiler-runtime artifact\DeltaGram.exe

      - name: Zip portable build.
        run: |
          powershell -Command "Compress-Archive -Path artifact\* -DestinationPath DeltaGram-win64.zip -Force"

      - uses: actions/upload-artifact@v7
        name: Upload DeltaGram.exe.
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            artifact\
            DeltaGram-win64.zip
          retention-days: 14

      - name: Save libraries cache (always).
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: libs-v6-${{ env.CACHE_KEY }}

      - name: Save Qt cache (always).
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: qt6-v6-${{ env.CACHE_KEY }}
